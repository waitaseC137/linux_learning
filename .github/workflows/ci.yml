name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: robinagent   # tüm komutlar robinagent/ içinden çalışır
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: YAML oyun tanımlarını doğrula
        run: |
          python -c "import glob, yaml; [yaml.safe_load(open(f)) for f in glob.glob('games/*.yaml')]; print('YAML OK')"

      - name: Modüller import oluyor mu (smoke test)
        # DİKKAT: robinagent.py (entry point) BİLEREK import EDİLMİYOR.
        # ensure_tmux() modül seviyesinde çalışıyor ve runner'da tmux kurulu
        # olduğu için kendini tmux'a exec etmeye çalışır -> CI takılır.
        run: |
          python -c "import core.progress, core.command_handler, core.notebooklm_bridge, core.ssh_manager; print('import OK')"

      - name: Lint (sadece gerçek hatalar, stil gürültüsü yok)
        run: ruff check . --select E9,F63,F7,F82

      - name: Testler (tests/ klasörü varsa çalışır)
        run: |
          if [ -d tests ]; then pytest -q; else echo "Henüz test yok — atlanıyor"; fi
